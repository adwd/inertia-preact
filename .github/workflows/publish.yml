name: Publish

# Publishes the adapter to GitHub Packages when a version tag (e.g. v0.1.0) is pushed
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish to GitHub Packages
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check that the tag matches the package version
        run: |
          version=$(node -p "require('./packages/preact/package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag $GITHUB_REF_NAME doesn't match the package version $version"
            exit 1
          fi
      - run: pnpm build
      - run: pnpm test
      # The registry comes from publishConfig in the package.json
      - name: Publish
        working-directory: packages/preact
        run: |
          echo "//npm.pkg.github.com/:_authToken=\${NODE_AUTH_TOKEN}" > "$NPM_CONFIG_USERCONFIG"
          npm publish
        env:
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/.npmrc
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
