name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  checks:
    name: Build, types, lint and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm type-check
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test

  # The harness runs Playwright without CI set, so --retries and --workers give the settings of the Inertia
  # repository's CI: retries, since a few of its tests are timing sensitive (see docs/PLAN.md), and a core
  # left for the test server.
  e2e-chromium:
    name: E2E (Chromium, Preact ${{ matrix.preact }}, ${{ matrix.http }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        preact: [lockfile, 10.27.2, 11.0.0-rc.2]
        http: [default]
        include:
          - { preact: lockfile, http: axios }
    env:
      PREACT_VERSION: ${{ matrix.preact != 'lockfile' && matrix.preact || '' }}
      VITE_HTTP_CLIENT: ${{ matrix.http }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-e2e
        with:
          browser: chromium
      - run: node scripts/e2e.mjs --skip-install --retries=2 --workers=3
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-chromium-${{ matrix.preact }}-${{ matrix.http }}
          path: e2e/inertia/test-results

  # Firefox and WebKit run one test at a time. Some tests race against fixed delays (a 75 ms hover delay, slow
  # requests), which they lose on loaded runners, whatever the adapter (see docs/PLAN.md).
  e2e-firefox:
    name: E2E (Firefox, shard ${{ matrix.shard }} of 5)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-e2e
        with:
          browser: firefox
      - run: node scripts/e2e.mjs --skip-install --firefox --retries=2 --workers=1 --shard=${{ matrix.shard }}/5
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-firefox-${{ matrix.shard }}
          path: e2e/inertia/test-results

  # On macOS, like Safari, as in the Inertia repository
  e2e-webkit:
    name: E2E (WebKit, shard ${{ matrix.shard }} of 4)
    runs-on: macos-15
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-e2e
        with:
          browser: webkit
      - run: node scripts/e2e.mjs --skip-install --webkit --retries=2 --workers=1 --shard=${{ matrix.shard }}/4
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-webkit-${{ matrix.shard }}
          path: e2e/inertia/test-results

  e2e-ssr:
    name: E2E SSR (Preact ${{ matrix.preact }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        preact: [lockfile, 11.0.0-rc.2]
    env:
      PREACT_VERSION: ${{ matrix.preact != 'lockfile' && matrix.preact || '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-e2e
        with:
          browser: chromium
      - run: node scripts/e2e.mjs --skip-install --ssr --retries=2 --workers=3
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-ssr-${{ matrix.preact }}
          path: e2e/inertia/test-results
